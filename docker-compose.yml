services:
  mysqllab:
    build: ./config_database
    image: aqualife-mysql:local
    container_name: aqualife_mysql
    restart: unless-stopped
    command: --max-allowed-packet=512M
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: AquaLife
      MYSQL_USER: aqualife_user
      MYSQL_PASSWORD: aqualife_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqualife_net

  # NoSQL orientado a documentos (MongoDB) - respalda la Tarea 5 (documentación
  # jerárquica de especies: ficha principal + documentos secundarios).
  mongo:
    image: mongo:latest
    container_name: aqualife_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aqualife_net

  # NoSQL orientado a grafos (Neo4j) - respalda la Tarea 4.b (modelo alternativo
  # de conversaciones en hilos de comentarios).
  neo4j:
    image: neo4j:latest
    container_name: aqualife_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - aqualife_net


volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  aqualife_net:
    driver: bridge
